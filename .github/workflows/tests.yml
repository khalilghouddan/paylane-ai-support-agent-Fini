
name: Tests

on:
  push:
    branches:
      - main
      - "feat/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run automated tests
        run: uv run pytest -v
